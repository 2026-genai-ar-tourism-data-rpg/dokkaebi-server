# ============================================================
# [v1] deploy.yml — main 머지 시 EC2 자동 배포 (server 서비스만 재빌드)
# pipeline: 인프라 / CI-CD
# 구현(요약): main push → SSH로 EC2 접속 → server 레포 main 동기화 →
#            compose로 server 서비스만 빌드·재기동 → HTTPS 공개 헬스체크.
#            시크릿: DEPLOY_HOST, DEPLOY_SSH_KEY (org 레벨 권장).
# 구현일: 2026-08-31 | 작성: kys (deploy-cicd/kys/v1)
# ============================================================
name: deploy-server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2        # ai/server/infra 배포가 EC2에서 겹치지 않게 직렬화
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy server to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/dokkaebi/dokkaebi-server
            git fetch origin main
            git reset --hard origin/main
            cd ~/dokkaebi/dokkaebi-infra
            docker compose -f docker-compose.prod.yml up -d --build server
            # Caddy 경유 공개 헬스체크 (경로는 /v1/health — /health 아님)
            for i in $(seq 1 12); do
              if curl -sf https://dokkaebi-api.yeseulkim.cloud/v1/health; then
                echo "server healthy"; exit 0
              fi
              sleep 5
            done
            echo "server health check failed"; docker compose -f docker-compose.prod.yml logs --tail 100 server; exit 1
